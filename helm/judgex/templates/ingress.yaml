{{- if .Values.ingress.enabled }}
{{- if eq .Values.ingress.className "traefik" }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: judgex
  namespace: {{ include "judgex.namespace" . }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ include "judgex.namespace" . }}-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-limit
  namespace: {{ include "judgex.namespace" . }}
spec:
  buffering:
    maxRequestBodyBytes: {{ .Values.ingress.traefik.uploadLimitBytes }}
{{- else }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: judgex
  namespace: {{ include "judgex.namespace" . }}
  annotations:
{{ toYaml .Values.ingress.annotations | indent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
{{- end }}
{{- end }}
