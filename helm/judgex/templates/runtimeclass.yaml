{{- if .Values.runtimeClass.enabled }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  namespace: {{ include "judgex.namespace" . }}
handler: {{ .Values.runtimeClass.handler }}
{{- if .Values.sandbox.nodeSelector }}
scheduling:
  nodeSelector:
{{ toYaml .Values.sandbox.nodeSelector | indent 4 }}
  tolerations:
{{ toYaml .Values.sandbox.tolerations | indent 4 }}
{{- end }}
{{- end }}
