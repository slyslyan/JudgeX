apiVersion: v1
kind: ConfigMap
metadata:
  name: judgex-config
  namespace: judgex
data:
  SERVER_PORT: "8080"
  DB_HOST: mysql.judgex.svc.cluster.local
  DB_PORT: "3306"
  DB_USER: judgex
  DB_NAME: judgex
  REDIS_ADDR: redis.judgex.svc.cluster.local:6379
  NSQD_ADDR: nsqd.judgex.svc.cluster.local:4150
  TEST_DATA_PATH: /data/testcases
  LOG_LEVEL: info
  LLM_API_URL: https://api.openai.com/v1
  LLM_MODEL: gpt-4o-mini
  SANDBOX_MODE: "gvisor"
