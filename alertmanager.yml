# AlertManager configuration for JudgeX
# Routes alerts to the AIOps webhook for automatic SRE diagnosis.
#
# Usage: mount into AlertManager container at /etc/alertmanager/alertmanager.yml
route:
  receiver: "judgex-aiops"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 2m
  repeat_interval: 1h

  # Route critical alerts immediately, group warnings by name
  routes:
    - receiver: "judgex-aiops-critical"
      match:
        severity: critical
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m

    - receiver: "judgex-aiops"
      match:
        severity: warning
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 1h

receivers:
  - name: "judgex-aiops"
    webhook_configs:
      - url: "http://backend:8080/api/admin/alerts/webhook"
        send_resolved: true
        http_config:
          timeout: 65s

  - name: "judgex-aiops-critical"
    webhook_configs:
      - url: "http://backend:8080/api/admin/alerts/webhook"
        send_resolved: true
        http_config:
          timeout: 65s
